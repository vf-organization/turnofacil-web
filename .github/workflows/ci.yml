name: CI/CD Web

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, tests y SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests y cobertura
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Analisis de calidad (SonarCloud)
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-cobertura
          path: coverage
          retention-days: 7

  seguridad:
    name: Seguridad de dependencias (Snyk)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Snyk - analisis de dependencias
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  imagen:
    name: Imagen Docker
    needs: [calidad, seguridad]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen en minusculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name web -p 8080:8080 \
            -e API_URL=http://127.0.0.1:9999 "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/healthz && break
            sleep 2
          done
          curl -sf http://localhost:8080/ | grep -q 'id="root"'

      - name: Logs y limpieza
        if: always()
        run: |
          docker logs web || true
          docker rm -f web || true

      - name: Snyk - escaneo de la imagen
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          args: --file=Dockerfile --severity-threshold=high --exclude-base-image-vulns

      - name: Login en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen con el SHA del commit
        if: github.event_name == 'push'
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Publicar tag latest (solo main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"