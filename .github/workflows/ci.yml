name: CI/CD Web

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, tests y SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Tests y cobertura
        run: npm run test:coverage

      - name: Configurar credenciales AWS (solo push)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Publicar cobertura en CloudWatch
        if: github.event_name == 'push'
        run: |
          COVERAGE=$(python3 - <<'PY'
          lf = lh = 0
          with open('coverage/lcov.info') as f:
              for line in f:
                  if line.startswith('LF:'):
                      lf += int(line[3:])
                  elif line.startswith('LH:'):
                      lh += int(line[3:])
          print(f"{lh * 100.0 / lf:.2f}" if lf else "0.00")
          PY
          )
          echo "Cobertura Web: $COVERAGE%"
          aws cloudwatch put-metric-data \
            --namespace TurnoFacil/CI \
            --metric-name CoveragePercent \
            --value "$COVERAGE" \
            --unit Percent \
            --dimensions Service=turnofacil-web \
            --region us-east-1

      - name: Build
        run: npm run build

      - name: Analisis de calidad (SonarCloud)
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') && '-Dsonar.qualitygate.wait=false' || '-Dsonar.qualitygate.wait=true' }}

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reporte-cobertura
          path: coverage
          retention-days: 7

  seguridad:
    name: Seguridad de dependencias (Snyk)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Snyk - analisis de dependencias
        uses: snyk/actions/node@11b673cfb4b0dc0d860a1323caa199d54950dcce
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  imagen:
    name: Imagen Docker
    needs: [calidad, seguridad]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Nombre de la imagen en minusculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Construir imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name web -p 8080:8080 \
            -e API_URL=http://127.0.0.1:9999 "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/healthz && break
            sleep 2
          done
          curl -sf http://localhost:8080/ | grep -q 'id="root"'

      - name: Logs y limpieza
        if: always()
        run: |
          docker logs web || true
          docker rm -f web || true

      - name: Snyk - escaneo de la imagen
        uses: snyk/actions/docker@11b673cfb4b0dc0d860a1323caa199d54950dcce
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          args: --file=Dockerfile --severity-threshold=high --exclude-base-image-vulns

      - name: Login en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen con el SHA del commit
        if: github.event_name == 'push'
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Publicar tag latest (solo main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"